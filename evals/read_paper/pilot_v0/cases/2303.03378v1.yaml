  limitations:
    - id: palme-limit-low-level-policy
      statement: >-
        PaLM-E emits textual decisions and assumes that available low-level policies
        can execute the selected skills; it does not itself solve motor control.
      provenance: author_stated
      evidence_refs: [palme-pdf-control-loop]
      critical: true

    - id: palme-limit-language-forgetting
      statement: >-
        End-to-end multimodal training can severely degrade inherited language
        capabilities at smaller scales; freezing the LLM or scaling up mitigates it.
      provenance: author_stated
      evidence_refs:
        - palme-pdf-retention
        - palme-pdf-discussion
        - palme-pdf-table-8
      critical: true

    - id: palme-limit-real-robot-quantification
      statement: >-
        The long-horizon real-robot examples are qualitative and provide no episode
        count, controlled baseline, or aggregate success rate.
      provenance: annotator_inference
      evidence_refs: [palme-pdf-real-robot]
      critical: true

    - id: palme-limit-compute-scale
      statement: >-
        The strongest generalist result uses a 562B-parameter composite model, while
        the paper does not establish a deployment-quality compute or latency tradeoff.
      provenance: annotator_inference
      evidence_refs:
        - palme-pdf-training
        - palme-pdf-table-5
      critical: false

  ambiguities:
    - id: palme-ambiguity-composite-size
      risk: Treating PaLM-E-12B, 84B, or 562B as the parameter count of the LLM alone.
      expected_disclosure: >-
        State the composite convention: 8B PaLM plus 4B ViT gives PaLM-E-12B,
        62B plus 22B gives 84B, and 540B plus 22B gives 562B.
      evidence_refs: [palme-pdf-training]
      critical: true

    - id: palme-ambiguity-table-2-header
      risk: >-
        Shifting a Table 2 value across task groups or demo counts because the
        three repeated numeric columns have a shared multi-level header.
      expected_disclosure: >-
        Preserve task, demo count, model size, training source, pretraining,
        LLM-freezing, and task-finetuning fields for every selected cell.
      evidence_refs: [palme-pdf-table-2, palme-tex-table-2]
      critical: true

    - id: palme-ambiguity-dash
      risk: Treating Table 1 or Table 2 dashes as zero-valued results.
      expected_disclosure: Treat dashes as unreported or unevaluated unless the table explicitly prints 0.0.
      evidence_refs:
        - palme-pdf-table-1
        - palme-pdf-table-2
        - palme-tex-table-1
        - palme-tex-table-2
      critical: true

    - id: palme-ambiguity-frozen-row
      risk: Collapsing frozen and unfrozen PaLM-E rows that otherwise share model size and full-mixture training.
      expected_disclosure: Preserve the LLM-frozen and task-finetuned flags as part of row identity.
      evidence_refs: [palme-pdf-table-2, palme-tex-table-2]
      critical: true

    - id: palme-ambiguity-table-4-metric
      risk: Reading Table 4 values as accuracy or confusing failure detection with affordance prediction.
      expected_disclosure: >-
        Identify both columns as F1 scores and use Tables 9 and 10 only when
        decomposing them into precision and recall.
      evidence_refs:
        - palme-pdf-table-4
        - palme-pdf-tables-9-10
        - palme-tex-table-4
      critical: true

    - id: palme-ambiguity-generalist-checkpoint
      risk: >-
        Comparing the generalist PaLM-E-562B row with task-specific rows without
        noting that the latter use separate finetuned checkpoints per task.
      expected_disclosure: Preserve Table 5's generalist-versus-task-specific group distinction.
      evidence_refs: [palme-pdf-table-5, palme-tex-table-5]
      critical: true

    - id: palme-ambiguity-real-robot
      risk: Turning Figure 5 examples into a quantitative real-robot benchmark result.
      expected_disclosure: Mark the real-robot evidence as qualitative demonstration only.
      evidence_refs: [palme-pdf-real-robot]
      critical: true

    - id: palme-ambiguity-rounded-language-drop
      risk: >-
        Treating Figure 6's rounded 3.9% drop and Table 8's -3.8% NLG delta as
        contradictory values or mixing NLU and NLG deltas.
      expected_disclosure: Use Table 8 for exact values and identify the metric as average NLG relative delta.
      evidence_refs:
        - palme-pdf-retention
        - palme-pdf-table-8
        - palme-tex-table-8
      critical: false

