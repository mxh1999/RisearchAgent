task:
  mode: standard
  allowed_sources:
    - pdf
    - tex
  source_strategy: pdf_first_tex_on_demand
  focused_questions:
    - >-
      What evidence supports transfer from heterogeneous vision-language and robot
      training, and which result settings must remain separate?
    - >-
      Recover the selected dense Table 2 cells with their complete task, demo-count,
      model-size, pretraining, freezing, and task-finetuning paths.
    - >-
      Separate quantitative simulated or benchmark results from qualitative
      real-robot demonstrations.
  completion_requirements:
    - Explain how continuous observations enter the language model embedding sequence.
    - Cover input encoders, training mixture, freezing variants, and the control loop.
    - Recover selected records from Tables 1, 2, 4, 5, and 8.
    - Resolve or explicitly disclose every known multi-level header ambiguity.
    - Cover language-retention tradeoffs and real-robot evidence scope.

reference:
  one_sentence_takeaway: >-
    PaLM-E interleaves learned continuous-observation embeddings with text tokens in
    a pretrained PaLM and reports cross-domain transfer across robot and
    vision-language tasks, with scale reducing language-task forgetting.

  evidence:
    - id: palme-pdf-abstract
      source: pdf
      page: 1
      section: Abstract
      anchor: "multi-modal sentences that interleave visual, continuous state estimation, and textual input"
      note: Headline architecture, tasks, transfer, and 562B claim.

    - id: palme-pdf-contributions
      source: pdf
      page: 3
      section: 1. Introduction
      anchor: "demonstrate positive transfer across different tasks"
      note: Stated contributions and generalist-versus-embodied positioning.

    - id: palme-pdf-architecture
      source: pdf
      page: 4
      section: 3. PaLM-E
      anchor: "Multi-modal sentences: injection of continuous observations"
      note: Encoder mapping, token interleaving, and decoder-only PaLM.

    - id: palme-pdf-control-loop
      source: pdf
      page: 4
      section: 3. PaLM-E
      anchor: "Embodying the output: PaLM-E in a robot control loop"
      note: Text outputs, low-level skill policies, and replanning boundary.

    - id: palme-pdf-input-representations
      source: pdf
      page: 5
      section: 4. Input and Scene Representations
      anchor: "State estimation vectors"
      note: State, ViT, object-centric, and OSRT input encoders.

    - id: palme-pdf-training
      source: pdf
      page: 5
      section: 5. Training Recipes
      anchor: "Variation with Model freezing"
      note: Composite model sizes, frozen-LLM option, and trainable encoders.

    - id: palme-pdf-cotraining
      source: pdf
      page: 6
      section: 5. Training Recipes
      anchor: "Co-training across tasks"
      note: Full mixture and transfer experimental design.

    - id: palme-pdf-tamp-analysis
      source: pdf
      page: 7
      section: 6.2. TAMP Environment
      anchor: "performance of the ViT-4B more than doubles"
      note: Interpretation of pretraining, full-mixture transfer, and OSRT results.

    - id: palme-pdf-table-1
      source: pdf
      page: 8
      section: 6.2. TAMP Environment
      table: Table 1
      anchor: "Comparison of different input representations on TAMP"
      note: One-percent TAMP success rates.

    - id: palme-pdf-real-robot
      source: pdf
