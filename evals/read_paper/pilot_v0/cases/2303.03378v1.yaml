  claims:
    - id: palme-claim-multimodal-token-injection
      statement: >-
        PaLM-E maps continuous observations into sequences of vectors with the
        language-token embedding dimension and interleaves them with ordinary text
        embeddings in a decoder-only PaLM prefix.
      evidence_refs: [palme-pdf-architecture]
      critical: true

    - id: palme-claim-text-control-boundary
      statement: >-
        PaLM-E autoregressively produces text; embodied plans are translated into
        actions by available low-level skill policies rather than direct motor control.
      evidence_refs: [palme-pdf-control-loop]
      critical: true

    - id: palme-claim-cross-domain-transfer
      statement: >-
        In the one-percent TAMP setting, changing ViT-4B training from a single
        robot to the full mixture raises p1 success from 30.6 to 74.1 and p2 from
        32.9 to 74.6, supporting the paper's cross-domain transfer claim.
      evidence_refs:
        - palme-pdf-tamp-analysis
        - palme-pdf-table-1
        - palme-tex-table-1
      critical: true

    - id: palme-claim-osrt-data-efficiency
      statement: >-
        OSRT is the strongest Table 1 input representation for TAMP planning,
        reporting 82.5 p1 and 76.2 p2 success without the large-scale VQA mixture.
      evidence_refs:
        - palme-pdf-table-1
        - palme-tex-table-1
      critical: true

    - id: palme-claim-generalist-okvqa
      statement: >-
        The single generalist PaLM-E-562B checkpoint reports 66.1 on OK-VQA val,
        higher than the other values listed in that Table 5 column.
      evidence_refs:
        - palme-pdf-table-5
        - palme-tex-table-5
      critical: true

    - id: palme-claim-scale-retention
      statement: >-
        End-to-end multimodal training causes severe average NLG degradation at
        PaLM-E-12B (-87.3% relative) but only -3.8% at PaLM-E-562B, so language
        retention improves markedly with scale.
      evidence_refs:
        - palme-pdf-retention
        - palme-pdf-table-8
        - palme-tex-table-8
      critical: true

    - id: palme-claim-real-robot-scope
      statement: >-
        PaLM-E is shown performing long-horizon real-robot tasks under disturbances,
        but this evidence is qualitative and is not accompanied by a success-rate study.
      evidence_refs: [palme-pdf-real-robot]
      critical: false

  method_components:
    - id: palme-method-modality-encoders
      name: Modality-specific input encoders
      role: Map continuous observations into sequences in the LLM embedding space.
      inputs:
        - robot state vectors
        - images
        - object-centric scene representations
      outputs:
        - continuous embedding tokens
      variants:
        - state MLP
        - ViT and token learner
        - OSRT with an MLP projector
      evidence_refs: [palme-pdf-input-representations]
      critical: true

    - id: palme-method-multimodal-sentence
      name: Multimodal sentence construction
      role: Dynamically interleave observation embeddings with text-token embeddings.
      inputs:
        - encoded observation vectors
        - tokenized text prompt
      outputs:
        - mixed embedding prefix
      evidence_refs: [palme-pdf-architecture]
      critical: true

    - id: palme-method-decoder
      name: Decoder-only PaLM backbone
      role: Autoregressively generate textual answers, decisions, or plans.
      inputs:
        - multimodal embedding prefix
      outputs:
        - text tokens
      evidence_refs: [palme-pdf-architecture]
      critical: true

    - id: palme-method-training
      name: Multitask multimodal training
      role: Train encoders and optionally the LLM over robot, vision-language, and language mixtures.
      inputs:
        - full or domain-specific training mixture
        - pretrained PaLM and ViT variants
      outputs:
        - frozen-LLM or end-to-end PaLM-E checkpoint
      evidence_refs:
        - palme-pdf-training
        - palme-pdf-cotraining
      critical: true

    - id: palme-method-control-loop
      name: Language-mediated robot control loop
      role: Execute generated short-horizon skill instructions and replan from new observations.
      inputs:
        - generated textual skill sequence
        - low-level language-conditioned policies
        - subsequent observations
      outputs:
        - executed robot actions
        - updated multimodal context
      evidence_refs: [palme-pdf-control-loop]
      critical: true

