  limitations:
    - id: vlfm-limit-single-floor
      statement: >-
        The 2D maps and missing odometry z-coordinate restrict VLFM to single-floor
        episodes, causing reported failures on 14.6% of HM3D and 9.6% of MP3D episodes.
      provenance: author_stated
      evidence_refs: [vlfm-pdf-single-floor-limit]
      critical: true

    - id: vlfm-limit-visible-target
      statement: >-
        The method assumes that the target is visible from the robot camera's
        default height and does not perform interactive search such as opening drawers.
      provenance: author_stated
      evidence_refs: [vlfm-pdf-conclusion-limits]
      critical: true

    - id: vlfm-limit-task-specific-map
      statement: >-
        The value map stores target-specific semantics and cannot directly support
        sequential targets, other navigation tasks, or long-horizon multitask execution.
      provenance: author_stated
      evidence_refs: [vlfm-pdf-conclusion-limits]
      critical: true

    - id: vlfm-limit-real-world-evaluation
      statement: >-
        The real-world section demonstrates feasibility but provides no episode
        count, success rate, or controlled comparison.
      provenance: annotator_inference
      evidence_refs: [vlfm-pdf-real-world]
      critical: false

  ambiguities:
    - id: vlfm-ambiguity-zero-shot
      risk: >-
        Interpreting zero-shot as meaning that every component is untrained or that
        no domain data was used anywhere in the system.
      expected_disclosure: >-
        State that zero-shot refers to ObjectNav-specific semantic training; list
        pretrained perception and the HM3D-trained PointNav policy separately.
      evidence_refs: [vlfm-pdf-detection, vlfm-pdf-pointnav]
      critical: true

    - id: vlfm-ambiguity-sota-scope
      risk: Claiming VLFM is best on every metric among every Table I row.
      expected_disclosure: >-
        Scope the headline to zero-shot rows and note that PIRLNav has higher HM3D
        success rate while VLFM has higher HM3D SPL.
      evidence_refs: [vlfm-pdf-table-1]
      critical: true

    - id: vlfm-ambiguity-dash
      risk: Treating a dash in Table I as a numeric zero.
      expected_disclosure: Treat dashes as not reported or not evaluated.
      evidence_refs: [vlfm-pdf-table-1]
      critical: true

    - id: vlfm-ambiguity-cross-dataset
      risk: Comparing Gibson, HM3D, and MP3D values as if they share episodes and difficulty.
      expected_disclosure: Keep each dataset and validation protocol as a separate setting.
      evidence_refs: [vlfm-pdf-table-1]
      critical: false

    - id: vlfm-ambiguity-real-world
      risk: Converting the qualitative Spot demonstration into a quantitative success claim.
      expected_disclosure: Explicitly mark the real-world result as qualitative.
      evidence_refs: [vlfm-pdf-real-world]
      critical: true

  coverage:
    required_areas:
      - id: vlfm-area-problem
        pages: [1, 2]
        description: Problem, zero-shot motivation, and task definition.
        evidence_refs: [vlfm-pdf-abstract, vlfm-pdf-overview]
      - id: vlfm-area-method
        pages: [2, 3, 4]
        description: Frontier map, value map, object detection, and waypoint policy.
        evidence_refs:
          - vlfm-pdf-overview
          - vlfm-pdf-value-map
          - vlfm-pdf-value-fusion
          - vlfm-pdf-detection
          - vlfm-pdf-pointnav
      - id: vlfm-area-primary-results
        pages: [5]
        description: Dataset protocols and Table I.
        evidence_refs: [vlfm-pdf-table-1]
      - id: vlfm-area-ablation-and-limits
        pages: [6]
        description: Table II, multi-floor failures, real-world deployment, and limitations.
        evidence_refs:
          - vlfm-pdf-table-2
          - vlfm-pdf-single-floor-limit
          - vlfm-pdf-real-world
          - vlfm-pdf-conclusion-limits
    optional_areas:
      - pages: [7]
        description: Remaining references.
