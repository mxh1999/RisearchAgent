[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    fast: Deterministic tests, safe for every PR (no LLM / no network)
    llm: Probabilistic tests that call real LLMs (run manually / nightly)
    llm_expensive: Release-gate tests with high LLM cost
    network: Tests that hit external APIs
