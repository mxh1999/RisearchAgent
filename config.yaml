topics:
- name: Lifelong & Long-Term Navigation Memory
  query: (cat:cs.RO OR cat:cs.AI OR cat:cs.CV) AND (("lifelong" OR "long-term" OR "persistent") AND "embodied navigation"
    AND ("memory" OR "map"))
  categories:
  - cs.RO
  - cs.AI
  - cs.CV
  research_profile: Your research focuses on Embodied AI, specifically on creating advanced memory structures for lifelong
    robot navigation. You are interested in developing decoupled memory mechanisms that can be integrated with Large Language
    Models (LLMs) and Vision-Language Models (VLMs). Your ideal memory structure is a hybrid model that combines the efficiency
    of compressed visual feature representations with the rich, relational reasoning capabilities of structured semantic maps
    (e.g., scene graphs). This approach aims to provide agents with a scalable and persistent memory, enabling them to operate
    effectively over long periods in complex, dynamic environments, as benchmarked by tasks like GOAT.
- name: Semantic & Structured Memory
  query: (cat:cs.RO OR cat:cs.AI OR cat:cs.CV) AND (("semantic map" OR "topological map" OR "scene graph") AND "embodied navigation")
  categories:
  - cs.RO
  - cs.AI
  - cs.CV
  research_profile: Your research focuses on Embodied AI, specifically on creating advanced memory structures for lifelong
    robot navigation. You are interested in developing decoupled memory mechanisms that can be integrated with Large Language
    Models (LLMs) and Vision-Language Models (VLMs). Your ideal memory structure is a hybrid model that combines the efficiency
    of compressed visual feature representations with the rich, relational reasoning capabilities of structured semantic maps
    (e.g., scene graphs). This approach aims to provide agents with a scalable and persistent memory, enabling them to operate
    effectively over long periods in complex, dynamic environments, as benchmarked by tasks like GOAT.
llm:
  filter_model: gemini-2.5-flash
  reader_model: gemini-2.5-pro
  embedding_model: gemini-embedding-001
  max_concurrent: 5
  temperature: 0.3
scraper:
  max_results_per_topic: 20
  delay_seconds: 3.0
  days_lookback: 30
filter:
  relevance_threshold: 6
  borderline_min: 4
db_path: data/papers.db
chroma_path: data/chroma
pdf_dir: data/pdfs
sota_dir: data/sota
