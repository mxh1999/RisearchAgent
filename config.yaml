topics:
  - name: "Object Navigation"
    query: '(cat:cs.RO OR cat:cs.AI OR cat:cs.CV) AND ("object navigation" OR ObjectNav OR "object goal navigation")'
    categories: ["cs.RO", "cs.AI", "cs.CV"]
    research_profile: >
      I research object goal navigation (ObjectNav) for embodied agents.
      Interested in methods that enable robots or virtual agents to navigate
      to target objects in unseen environments using visual observations.
      Key topics: semantic mapping, frontier exploration, zero-shot ObjectNav,
      LLM/VLM-based navigation, modular vs end-to-end approaches,
      sim-to-real transfer, and benchmark performance on HM3D/MP3D/RoboTHOR.

llm:
  filter_model: "gemini-2.5-flash"
  reader_model: "gemini-2.5-pro"
  embedding_model: "gemini-embedding-001"
  max_concurrent: 5
  temperature: 0.3

scraper:
  max_results_per_topic: 20
  delay_seconds: 3.0
  days_lookback: 30

filter:
  relevance_threshold: 6
  borderline_min: 4

db_path: "data/papers.db"
chroma_path: "data/chroma"
pdf_dir: "data/pdfs"
